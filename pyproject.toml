[project]
name = "document-analyst"
version = "0.1.0"
description = "Multi-agent system for SEAP public procurement analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LangChain/LangGraph (for agents)
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",

    # LLM SDKs (native)
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",  # for Ollama API

    # Database
    "sqlalchemy>=2.0.0",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.0",

    # Embeddings
    "sentence-transformers>=3.0.0",

    # Data processing
    "pandas>=2.0.0",

    # Prompts & validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",

    # SQL parsing & validation
    "sqlparse>=0.5.0",

    # ML (intent classifier)
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "torch>=2.0.0",

    # Environment
    "python-dotenv>=1.0.0",
    "rootutils>=1.0.0",

    # Document loaders
    "pypdf>=4.0.0",
    "unstructured>=0.15.0",

    # Rate limiting & retry
    "tenacity>=8.2.0",

    # MCP (Model Context Protocol)
    "fastmcp>=0.4.0",
    "uvicorn>=0.30.0",

    # API (FastAPI)
    "fastapi>=0.115.0",
    "starlette>=0.38.0,<0.42.0",

    # Migrations
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
